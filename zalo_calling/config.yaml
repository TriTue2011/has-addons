name: "Zalo Calling"
description: "Gọi thoại và video Zalo từ Home Assistant — nghe và nói qua loa R1, camera, mic của bạn"
url: "https://github.com/TriTue2011/Zalo-calling"
version: "2026.11.10.13"
slug: "zalo_calling"
init: false
arch:
  - amd64
  - aarch64
# Ảnh đa kiến trúc (amd64 + arm64) do kho Zalo-calling dựng khi đẩy tag vX; thẻ không có chữ v
# (đúng bằng "version" ở trên) là thẻ Supervisor kéo về.
image: "ghcr.io/tritue2011/zalo-calling"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "WebUI và API của app Zalo (có đăng nhập). Tích hợp Zalo Call trong HA nối vào cổng này. Chỉ để trong mạng LAN."
webui: "http://[HOST]:[PORT:8080]"
# Supervisor tự khởi động lại add-on khi trang đăng nhập (công khai, trả 200) thôi trả lời.
watchdog: "http://[HOST]:[PORT:8080]/login"
options:
  username: "admin"
  password: ""
schema:
  username: "str"
  # Bỏ trống cũng được: add-on tự sinh mật khẩu, giữ lại trong thư mục dữ liệu và in ra Log
  # mỗi lần khởi động (đổi được trong WebUI hoặc điền ở đây).
  password: "password?"
