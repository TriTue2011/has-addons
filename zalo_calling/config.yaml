name: "Zalo Calling"
description: "Gọi thoại/video Zalo từ Home Assistant — có WebUI ngay trong bảng bên (Ingress)"
url: "https://github.com/TriTue2011/Zalo-calling"
version: "2026.11.19.4"
slug: "zalo_calling"
init: false
ingress: true
ingress_port: 8080
ingress_stream: true
panel_icon: "mdi:phone-in-talk"
panel_title: "Zalo Calling"
panel_admin: true
arch:
  - amd64
  - aarch64
# Ảnh đa kiến trúc (amd64 + arm64) do kho Zalo-calling dựng khi đẩy tag vX; thẻ không có chữ v
# (đúng bằng "version" ở trên) là thẻ Supervisor kéo về.
image: "ghcr.io/tritue2011/zalo-calling-loader"
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "WebUI và API của app Zalo (có đăng nhập). Tích hợp Zalo Call trong HA nối vào cổng này. Chỉ để trong mạng LAN."
webui: "http://[HOST]:[PORT:8080]"
# Supervisor tự khởi động lại add-on khi đường này (công khai, không lộ gì) thôi trả lời.
watchdog: "http://[HOST]:[PORT:8080]/api/app/status"
options:
  username: "admin"
  password: ""
  webhook_url: ""
  github_token: ""
  app_version: ""
  save_photos: false
schema:
  username: "str?"
  # Bỏ trống cũng được: add-on tự sinh mật khẩu, giữ lại trong thư mục dữ liệu và in ra Log
  # mỗi lần khởi động (đổi được trong WebUI hoặc điền ở đây).
  password: "password?"
  # «str?» chứ không «url?»: giá trị mặc định là chuỗi rỗng, mà «url?» từ chối chuỗi rỗng
  # (Supervisor báo «Invalid configuration: expected a URL.» và add-on không chạy được).
  # App tự bỏ qua chuỗi rỗng (docker-entrypoint.py: str(opts.get("webhook_url") or "").strip()).
  webhook_url: "str?"
  # TOKEN GITHUB chỉ đọc kho Zalo-calling (bắt buộc, tối thiểu 20 ký tự; để trống thì Supervisor KHÔNG cho khởi động). Lần chạy đầu add-on dùng token để
  # tải mã từ kho riêng (image này công khai nhưng KHÔNG chứa mã). Sau lần đầu, token hết hạn thì add-on VẪN CHẠY bằng bản mã đã lưu, chỉ không cập nhật được.
  github_token: "password(20,255)"
  # Thẻ phiên bản mã cần tải (vd v2026.11.18.6). Để trống = đúng bản đóng gói trong image; «latest» = bản phát hành mới nhất.
  app_version: "str?"
  # Lưu ảnh đến xuống đĩa (/data/downloads)? Tắt (mặc định) = xem ảnh thẳng từ Zalo, KHÔNG lưu. Bật = lưu như trước (xem lại được khi địa chỉ Zalo hết hạn, tốn dung lượng đĩa).
  save_photos: "bool?"
