name: "Zalo Bot"
description: "Add-on Zalo Bot in Home Assistant"
url: "https://github.com/TriTue2011/has-addons"
version: "2026.11.19.1"
slug: "zalo_bot"
init: false
map:
  - config:rw
  - data:rw
  - share:rw
host_network: true
ports:
  3000/tcp: null
# Supervisor tự khởi động lại add-on khi đường này thôi trả lời.
watchdog: "http://[HOST]:[PORT:3000]/api/health"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
# Image KHỞI ĐỘNG công khai, đa kiến trúc (amd64, aarch64, armv7, armhf), KHÔNG chứa mã máy chủ. Mã Zalo Bot nằm ở kho riêng TriTue2011/zalo_bot (thư mục server/):
# lần chạy đầu add-on dùng github_token để tải mã về và lưu trong /data; sau đó token hết hạn thì VẪN CHẠY bản đã lưu (chỉ không cập nhật được).
# Thẻ image (= version ở trên) do kho zalo_bot dựng; workflow auto-bump của kho này tự nâng version theo thẻ image công khai mới nhất.
image: "ghcr.io/tritue2011/zalobot-loader"

options:
  data_directory: "/config/zalo_bot"
  # Để trống cũng chạy được, nhưng nên điền — xem giải thích ở README.
  session_secret: ""
  admin_password: ""
  api_key: ""
  github_token: ""
  app_version: ""
schema:
  data_directory: "str"
  # Khoá ký session. Bỏ trống cũng được: add-on tự sinh một khoá và giữ lại
  # trong thư mục dữ liệu, phiên vẫn sống qua restart.
  session_secret: "password?"
  # Mật khẩu admin lần đầu. Bỏ trống cũng được: add-on sinh ngẫu nhiên, giữ lại,
  # ghi ra THONG-TIN-DANG-NHAP.txt trong thư mục dữ liệu và in ra log mỗi lần
  # khởi động (bản cũ dùng 'admin' — ai cũng đoán được).
  admin_password: "password?"
  # Khoá cho các API gửi tin. Bỏ trống cũng được: add-on tự sinh một khoá, giữ
  # lại, và ghi vào THONG-TIN-DANG-NHAP.txt để chép ra dùng.
  api_key: "password?"
  # TOKEN GITHUB chỉ đọc kho zalo_bot (bắt buộc, tối thiểu 20 ký tự; để trống thì Supervisor KHÔNG cho khởi động). Lần chạy đầu add-on dùng token để tải mã từ
  # kho riêng. Sau lần đầu, token hết hạn thì add-on VẪN CHẠY bằng bản mã đã lưu, chỉ không cập nhật được.
  github_token: "password(20,255)"
  # Thẻ/commit mã cần tải (vd v2026.11.19.1). Để trống = đúng bản đóng gói trong image; «latest» = bản phát hành mới nhất.
  app_version: "str?"
