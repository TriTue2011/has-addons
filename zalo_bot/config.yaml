name: "Zalo Bot"
description: "Add-on Zalo Bot in Home Assistant"
url: "https://github.com/TriTue2011/has-addons"
version: "2026.9.2.2"
slug: "zalo_bot"
init: false
map:
  - config:rw
  - data:rw
  - share:rw
host_network: true
ports:
  3000/tcp: null
# Supervisor tự khởi động lại add-on khi đường này thôi trả lời.
watchdog: "http://[HOST]:[PORT:3000]/api/health"
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
# Một image đa kiến trúc cho cả bốn arch ở trên: Docker tự chọn đúng bản
# theo máy đang kéo. Dạng cũ "…zalobot-{arch}" đẻ ra bốn package riêng và
# theo tài liệu Home Assistant thì chỉ còn là fallback tương thích ngược.
image: "ghcr.io/tritue2011/zalobot"

options:
  data_directory: "/config/zalo_bot"
  # Để trống cũng chạy được, nhưng nên điền — xem giải thích ở README.
  session_secret: ""
  admin_password: ""
  api_key: ""
  # Tu khoa "tra loi ca tin cua CHINH CHU" khi bot chay tren chinh tai
  # khoan cua ban. Rong = tat (mac dinh, khong doi gi). Xem README.
  self_reply_keyword: ""
schema:
  data_directory: "str"
  # Khoá ký session. Bỏ trống cũng được: add-on tự sinh một khoá và giữ lại
  # trong thư mục dữ liệu, phiên vẫn sống qua restart.
  session_secret: "password?"
  # Mật khẩu admin lần đầu. Bỏ trống cũng được: add-on sinh ngẫu nhiên, giữ lại,
  # ghi ra THONG-TIN-DANG-NHAP.txt trong thư mục dữ liệu và in ra log mỗi lần
  # khởi động (bản cũ dùng 'admin' — ai cũng đoán được).
  admin_password: "password?"
  # Khoá cho các API gửi tin. Bỏ trống cũng được: add-on tự sinh một khoá, giữ
  # lại, và ghi vào THONG-TIN-DANG-NHAP.txt để chép ra dùng.
  api_key: "password?"
  # Bat buoc co ky tu neu muon bat tinh nang; rong = tat.
  self_reply_keyword: "str?"
