configuration:
  api_id:
    name: api_id Telegram
    description: Số App api_id lấy ở my.telegram.org → API development tools.
  api_hash:
    name: api_hash Telegram
    description: Chuỗi App api_hash lấy cùng chỗ với api_id. Giữ bí mật.
  gateway_token:
    name: Token gateway
    description: Bỏ trống thì add-on tự sinh và in ra tab Nhật ký. Tích hợp và WebUI dùng token này để kết nối.
  ha_webhook_url:
    name: Địa chỉ webhook HA (tuỳ chọn)
    description: Để gateway báo sự kiện (tin đến, cuộc gọi đến) về Home Assistant. Bỏ trống cũng được.
  video_profile:
    name: Chất lượng hình
    description: normal = 640x360, 15 khung/giây. low = 480x270, 10 khung/giây, nhẹ CPU hơn nhiều, dùng cho máy yếu.
network:
  3333/tcp: REST và WebUI của gateway (chỉ để trong mạng LAN)
