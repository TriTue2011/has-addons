# Add-on Zalo Calling — BẢN KHÔNG GIAO DIỆN (image :<version>-noui, nhỏ hơn, cho máy cấu hình yếu).
# Không có WebUI nên tên đăng nhập và mật khẩu BẮT BUỘC đặt ở đây (thiếu là Supervisor không cho khởi động).
# Đọc/đổi các cài đặt khác lúc đang chạy bằng dịch vụ HA zalo_call.get_app_settings / set_app_settings /
# set_app_password hoặc curl tới /api/... (xem DOCS.md). Đăng nhập Zalo bằng dịch vụ zalo_call.login_qr.
# version = bản phát hành của kho Zalo-calling + «-noui» (.github/scripts/auto_bump.py nâng khi ảnh đã đủ amd64+arm64).
name: "Zalo Calling (không giao diện)"
description: "Gọi thoại/video Zalo từ Home Assistant — bản nhẹ, không WebUI, cấu hình bằng tuỳ chọn add-on"
version: "2026.11.19.5-noui"
slug: "zalo_calling_noui"
url: "https://github.com/TriTue2011/Zalo-calling"
arch:
  - amd64
  - aarch64
init: false
ports:
  8080/tcp: 8080
ports_description:
  8080/tcp: "Tích hợp Zalo Call và loa/camera trong nhà gọi vào cổng này; để nguyên 8080 là chạy được ngay"
watchdog: "http://[HOST]:[PORT:8080]/api/app/status"
options:
  username: "admin"
  password: ""
  webhook_url: ""
  github_token: ""
  app_version: ""
  save_photos: false
schema:
  username: "str(1,64)"
  password: "password(8,128)"
  # «str?» chứ không «url?»: giá trị mặc định là chuỗi rỗng, mà «url?» từ chối chuỗi rỗng
  # (Supervisor báo «Invalid configuration: expected a URL.» và add-on không chạy được).
  # App tự bỏ qua chuỗi rỗng (docker-entrypoint.py: str(opts.get("webhook_url") or "").strip()).
  webhook_url: "str?"
  # TOKEN GITHUB chỉ đọc kho Zalo-calling (bắt buộc, tối thiểu 20 ký tự; để trống thì Supervisor KHÔNG cho khởi động). Lần chạy đầu add-on dùng token để
  # tải mã từ kho riêng (image này công khai nhưng KHÔNG chứa mã). Sau lần đầu, token hết hạn thì add-on VẪN CHẠY bằng bản mã đã lưu, chỉ không cập nhật được.
  github_token: "password(20,255)"
  # Thẻ phiên bản mã cần tải (vd v2026.11.18.6). Để trống = đúng bản đóng gói trong image; «latest» = bản phát hành mới nhất.
  app_version: "str?"
  # Lưu ảnh đến xuống đĩa (/data/downloads)? Tắt (mặc định) = xem ảnh thẳng từ Zalo, KHÔNG lưu. Bật = lưu như trước (xem lại được khi địa chỉ Zalo hết hạn, tốn dung lượng đĩa).
  save_photos: "bool?"
image: "ghcr.io/tritue2011/zalo-calling-loader"
