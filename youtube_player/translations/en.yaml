configuration:
  app_title:
    name: Display title
    description: The title shown at the top of the player interface.
  max_history:
    name: History size
    description: Number of recent videos or playlists to retain, from 1 to 100.
  integration_token:
    name: Integration token
    description: Optional bearer token for the Home Assistant integration. Leave empty to generate one in /data.
  public_base_url:
    name: LAN playback URL
    description: HTTP(S) URL such as http://IP:8099 reachable by speakers; required for Zing playback.
network:
  8099/TCP: Direct web interface; it does not need to be exposed when using Ingress.
