configuration:
  app_title:
    name: Tên hiển thị
    description: Tên xuất hiện trên đầu giao diện trình phát.
  max_history:
    name: Số mục lịch sử
    description: Số video hoặc playlist được lưu gần đây, từ 1 đến 100.
  integration_token:
    name: Token tích hợp
    description: Bearer token tùy chọn cho custom integration. Để trống để tự sinh và lưu trong /data.
  public_base_url:
    name: URL phát trong mạng LAN
    description: URL HTTP(S) dạng http://IP:8099 mà loa có thể truy cập; bắt buộc khi phát Zing.
network:
  8099/TCP: Giao diện web trực tiếp; không cần mở khi dùng Ingress.
