name: Build & Push ZaloBot

on:
  push:
    branches: [main]
    paths:
      - 'zalo_bot/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
          - arch: armv7
            platform: linux/arm/v7
          - arch: armhf
            platform: linux/arm/v6

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag PHẢI khớp `version` trong zalo_bot/config.yaml: Supervisor kéo
      # đúng `{image}:{version}` lấy từ đó. Ghi cứng số ở đây thì mỗi lần nâng
      # version trong config.yaml là add-on đi tìm một tag không tồn tại và
      # hỏng khi cài — đọc thẳng ra để hai nơi không thể lệch nhau.
      - name: Lấy version từ config.yaml
        id: ver
        run: |
          v=$(grep -E '^version:' zalo_bot/config.yaml | head -1 \
              | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          if [ -z "$v" ]; then echo "Không đọc được version"; exit 1; fi
          echo "Add-on version: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push ${{ matrix.arch }}
        uses: docker/build-push-action@v5
        with:
          context: ./zalo_bot
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/tritue2011/zalobot-${{ matrix.arch }}:latest
            ghcr.io/tritue2011/zalobot-${{ matrix.arch }}:${{ steps.ver.outputs.v }}
