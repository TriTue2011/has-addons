name: Build & Push ZaloBot

on:
  push:
    branches: [main]
    paths:
      - 'zalo_bot/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  # MỘT image cho mọi kiến trúc. Trước đây mỗi kiến trúc là một package riêng
  # (zalobot-amd64, -aarch64, -armv7, -armhf) vì config.yaml dùng chỗ giữ chỗ
  # {arch}. Tài liệu Home Assistant nói dạng chính là tên image đa kiến trúc,
  # còn {arch} chỉ giữ lại cho tương thích ngược.
  REGISTRY_IMAGE: ghcr.io/tritue2011/zalobot

jobs:
  build:
    # arm64 dựng trên MÁY ARM THẬT. Trước đây mọi kiến trúc đều chạy trên máy
    # x86 rồi giả lập bằng QEMU: amd64 và arm/v6, arm/v7 vẫn xong trong hơn một
    # phút, riêng arm64 có lượt kẹt gần 4 tiếng ở đúng bước build — mà arm64 lại
    # là kiến trúc của máy Home Assistant. Kẹt build thì tag chưa lên registry,
    # Supervisor kéo về gặp 404 và add-on không cài được.
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
          # Chưa có máy chạy thật cho ARM 32-bit; hai nhánh này vẫn qua QEMU,
          # và chúng vốn vẫn xong nhanh nên để nguyên.
          - platform: linux/arm/v7
            runner: ubuntu-latest
          - platform: linux/arm/v6
            runner: ubuntu-latest

    steps:
      - name: Đặt tên nền tảng dùng cho artifact
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Đẩy theo DIGEST, chưa gắn tag. Gắn tag ngay ở đây thì mỗi kiến trúc lại
      # ghi đè tag của kiến trúc trước; job merge bên dưới mới là nơi tạo tag.
      - name: Build ${{ matrix.platform }} (đẩy theo digest)
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ./zalo_bot
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Xuất digest ra tệp
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Tải digest lên artifact
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tải mọi digest về
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag PHẢI khớp `version` trong zalo_bot/config.yaml: Supervisor kéo đúng
      # `{image}:{version}` lấy từ đó. Ghi cứng số ở đây thì mỗi lần nâng
      # version là add-on đi tìm một tag không tồn tại và hỏng khi cài.
      - name: Lấy version từ config.yaml
        id: ver
        run: |
          v=$(grep -E '^version:' zalo_bot/config.yaml | head -1 \
              | sed -E 's/^version:[[:space:]]*"?([^"]+)"?[[:space:]]*$/\1/')
          if [ -z "$v" ]; then echo "Không đọc được version"; exit 1; fi
          echo "Add-on version: $v"
          echo "v=$v" >> "$GITHUB_OUTPUT"

      - name: Gộp thành một manifest đa kiến trúc rồi đẩy
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${REGISTRY_IMAGE}:latest" \
            -t "${REGISTRY_IMAGE}:${VERSION}" \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY_IMAGE }}
          VERSION: ${{ steps.ver.outputs.v }}

      - name: Soi lại manifest vừa đẩy
        run: docker buildx imagetools inspect "${{ env.REGISTRY_IMAGE }}:${{ steps.ver.outputs.v }}"
